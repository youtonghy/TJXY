services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TJXY_POSTGRES_DB:-tjxy}
      POSTGRES_USER: ${TJXY_POSTGRES_USER:-tjxy}
      POSTGRES_PASSWORD: ${TJXY_POSTGRES_PASSWORD:-tjxy-local-dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tjxy-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  tjxy:
    build:
      context: .
    image: tjxy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8096:8096"
    environment:
      TJXY_CONTAINER: "true"
      TJXY_CONFIG_FILE: /config/tjxy.toml
      TJXY_SETUP_DATA_DIR: /data
      TJXY_SETUP_BIND: 0.0.0.0:8096
      TJXY_ASSETS_DIR: /data/assets
      TJXY_ADMIN_DIST_DIR: /app/admin/dist
      TJXY_LOG_DIR: /data/logs
      TJXY_LOG_FILE: /data/server.log
    volumes:
      - tjxy-config:/config
      - tjxy-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  tjxy-config:
  tjxy-data:
  tjxy-postgres:
