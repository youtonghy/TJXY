services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TJXY_POSTGRES_DB:-tjxy}
      POSTGRES_USER: ${TJXY_POSTGRES_USER:-tjxy}
      POSTGRES_PASSWORD: ${TJXY_POSTGRES_PASSWORD:?run ./tjxy-setup to initialize PostgreSQL}
    volumes:
      - tjxy-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  tjxy:
    build:
      context: .
    image: tjxy:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TJXY_PUBLISH_HOST:-127.0.0.1}:${TJXY_PORT:-8096}:8096"
    environment:
      TJXY_CONTAINER: "true"
      TJXY_CONFIG_FILE: /config/tjxy.toml
      TJXY_SETUP_DATA_DIR: /data
      TJXY_SETUP_BIND: 0.0.0.0:8096
      TJXY_ASSETS_DIR: /data/assets
      TJXY_ADMIN_DIST_DIR: /app/admin/dist
      TJXY_LOG_DIR: /data/logs
      TJXY_WORK_HISTORY_RETENTION_ENABLED: ${TJXY_WORK_HISTORY_RETENTION_ENABLED:-true}
      TJXY_WORK_HISTORY_RETENTION_DAYS: ${TJXY_WORK_HISTORY_RETENTION_DAYS:-7}
      TJXY_SETUP_POSTGRES_HOST: postgres
      TJXY_SETUP_POSTGRES_PORT: "5432"
      TJXY_SETUP_POSTGRES_DATABASE: ${TJXY_POSTGRES_DB:-tjxy}
      TJXY_SETUP_POSTGRES_USERNAME: ${TJXY_POSTGRES_USER:-tjxy}
      TJXY_SETUP_POSTGRES_PASSWORD: ${TJXY_POSTGRES_PASSWORD:?run ./tjxy-setup to initialize PostgreSQL}
      TJXY_SETUP_POSTGRES_TLS: disable
    volumes:
      - "${TJXY_CONFIG_DIR:-./.tjxy/config}:/config"
      - "${TJXY_DATA_DIR:-./.tjxy/data}:/data"
      - "${TJXY_MEDIA_DIR:-./media}:/media:${TJXY_MEDIA_MODE:-rw}"
    user: "${TJXY_UID:-10001}:${TJXY_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  tjxy-postgres:
