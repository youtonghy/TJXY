services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TJXY_POSTGRES_DB:-tjxy}
      POSTGRES_USER: ${TJXY_POSTGRES_USER:-tjxy}
      POSTGRES_PASSWORD: ${TJXY_POSTGRES_PASSWORD:?run ./tjxy-setup to initialize PostgreSQL}
    ports:
      - "127.0.0.1:${TJXY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - tjxy-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tjxy-postgres:
