[workspace]
members = [
    "crates/credentials",
    "crates/application",
    "crates/api",
    "crates/cache",
    "crates/common",
    "crates/db",
    "crates/domain",
    "crates/import",
    "crates/metadata",
    "crates/storage",
    "crates/storage-filesystem",
    "crates/storage-google-drive",
    "crates/storage-onedrive",
    "crates/server",
    "crates/test-support",
    "tjxy-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
async-trait = "0.1.89"
async-stream = "0.3.6"
argon2 = "0.5.3"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
getrandom = "0.3.4"
httpdate = "1.0.3"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
md-5 = "0.10.6"
notify = "=9.0.0-rc.4"
quick-xml = "0.38.4"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sea-orm = { version = "1.1.14", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-uuid", "with-json", "with-chrono"] }
sea-orm-migration = { version = "1.1.14", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
rustix = { version = "1.1.4", features = ["fs"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
tower = "0.5.3"
tempfile = "3.20.0"
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.16.0", features = ["serde", "v4", "v5"] }
zeroize = { version = "1.8.1", features = ["alloc", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
