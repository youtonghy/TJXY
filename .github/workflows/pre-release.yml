name: Pre-release CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.88.0

jobs:
  frontend-format-check:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix admin ci
      - name: Configure HeroUI Pro
        working-directory: admin
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          if [ -z "$HEROUI_KEY" ]; then
            echo 'Repository secret HEROUI_KEY is required for frontend checks.' >&2
            exit 1
          fi
          npx -y hpsetup@4.7.0 --auto
          test -f node_modules/@heroui-pro/react/dist/css/index.css
          test -f node_modules/@heroui-pro/react/dist/components/index.d.ts
      - name: Typecheck frontend
        run: npm --prefix admin run typecheck
      - name: Lint frontend
        run: npm --prefix admin run lint

  rust-checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - name: Configure Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tjxy-target" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "$RUST_VERSION"
      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=2
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
