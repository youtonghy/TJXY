name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from main, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.88.0
  RELEASE_INPUT: ${{ inputs.version || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Resolve release version
        id: release
        run: |
          version="${RELEASE_INPUT#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo 'Version must be semantic, for example 0.2.0 or v0.2.0.' >&2
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            workspace_version="$(awk '
              /^\[workspace.package\]$/ { in_package = 1; next }
              in_package && /^\[/ { exit }
              in_package && /^version = / {
                gsub(/^[^\"]*\"|\".*$/, "")
                print
                exit
              }
            ' Cargo.toml)"
            test -n "$workspace_version"
            test "$version" = "$workspace_version"
            git rev-parse --verify "refs/tags/$tag"
          fi
      - name: Pin release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      VITE_TJXY_VERSION: ${{ needs.validate.outputs.release_version }}
      VITE_TJXY_COMMIT: ${{ needs.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix admin ci
      - name: Configure HeroUI Pro
        working-directory: admin
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          if [ -z "$HEROUI_KEY" ]; then
            echo 'Repository secret HEROUI_KEY is required for release builds.' >&2
            exit 1
          fi
          npx -y hpsetup@latest --auto
      - name: Verify and build frontend
        run: |
          npm --prefix admin run typecheck
          npm --prefix admin run lint
          npm --prefix admin test -- --run
          npm --prefix admin run build
      - name: Upload frontend distribution
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: admin/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Configure Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tjxy-target" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "$RUST_VERSION"
      - name: Report initial disk space
        run: df -h
      - name: Verify Rust workspace
        run: |
          cargo test --workspace --locked -- --test-threads=2
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check
      - name: Report Rust artifact disk usage
        if: ${{ always() }}
        run: |
          df -h
          du -sh "$CARGO_TARGET_DIR" 2>/dev/null || true

  package:
    needs: [validate, frontend, rust]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      TJXY_BUILD_VERSION: ${{ needs.validate.outputs.release_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64-gnu
          - target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"
      - name: Install ARM64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Download frontend distribution
        uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: admin/dist
      - name: Build Linux binaries
        run: |
          if [ "${{ matrix.target }}" = 'aarch64-unknown-linux-gnu' ]; then
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --profile dist --locked --target "${{ matrix.target }}" -p tjxy-server --bin tjxy-server
          cargo build --profile dist --locked --target "${{ matrix.target }}" -p tjxy-tui --bin tjxy-tui
      - name: Package portable release
        run: scripts/package-release.sh "$RELEASE_TAG" "${{ matrix.target }}" "${{ matrix.asset_suffix }}"
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_suffix }}
          path: dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  docker-image:
    needs: [validate, frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Download frontend distribution
        uses: actions/download-artifact@v5
        with:
          name: admin-dist
          path: admin/dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          build-contexts: |
            frontend=./admin/dist
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          build-args: |
            TJXY_BUILD_VERSION=${{ needs.validate.outputs.release_version }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tjxy-image-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=tjxy-image-${{ matrix.pair }}
          provenance: true
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [validate, docker-image]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          refs=()
          for digest in *; do
            refs+=("$image@sha256:$digest")
          done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create \
            --tag "$image:$RELEASE_VERSION" \
            --tag "$image:latest" \
            "${refs[@]}"
      - name: Inspect image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "$image:$RELEASE_VERSION"

  publish:
    needs: [validate, package, docker-manifest]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist/release
        run: sha256sum tjxy-*.tar.gz > SHA256SUMS
      - name: Create or update GitHub Release
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
              --target "$(git -C ../.. rev-parse HEAD)" \
              --generate-notes
          fi
