name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Select Rust toolchain
        run: rustup default 1.88.0
      - name: Install frontend dependencies
        run: npm --prefix admin ci
      - name: Type-check frontend
        run: npm --prefix admin run typecheck
      - name: Lint frontend
        run: npm --prefix admin run lint
      - name: Test frontend
        run: npm --prefix admin test -- --run
      - name: Build frontend
        run: npm --prefix admin run build
      - name: Install Playwright Chromium
        run: npm --prefix admin exec -- playwright install --with-deps chromium
      - name: Run production workflow
        run: npm --prefix admin run e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: admin/output/playwright
          if-no-files-found: ignore
          retention-days: 7

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Select Rust toolchain
        run: rustup default 1.88.0
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check

  postgres-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tjxy_test
        options: >-
          --health-cmd "pg_isready -U postgres -d tjxy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      TJXY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tjxy_test
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Select Rust toolchain
        run: rustup default 1.88.0
      - name: Run PostgreSQL database contracts
        run: cargo test -p tjxy-test-support -p tjxy-db --tests --locked
      - name: Run PostgreSQL application contracts
        run: cargo test -p tjxy-application --tests --locked
      - name: Run PostgreSQL import contracts
        run: cargo test -p tjxy-import --tests --locked
      - name: Run PostgreSQL server contracts
        run: cargo test -p tjxy-server --tests --locked

  redis-contracts:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 6379:6379
    env:
      TJXY_TEST_REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Select Rust toolchain
        run: rustup default 1.88.0
      - name: Run Redis invalidation contract
        run: cargo test -p tjxy-cache --test redis_invalidation_contract --locked -- --ignored

  mysql-contracts:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql@sha256:870634c634aae968ea1a93e5c094a14e00c692da2ee9bed956b3dfcc7bd08cb0
        env:
          MYSQL_ROOT_PASSWORD: tjxy
          MYSQL_DATABASE: tjxy_test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptjxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
        ports:
          - 3306:3306
    env:
      TJXY_TEST_DATABASE_URL: mysql://root:tjxy@127.0.0.1:3306/tjxy_test
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Select Rust toolchain
        run: rustup default 1.88.0
      - name: Run MySQL database contracts
        run: cargo test -p tjxy-test-support -p tjxy-db --tests --locked
      - name: Run MySQL application contracts
        run: cargo test -p tjxy-application --tests --locked
      - name: Run MySQL import contracts
        run: cargo test -p tjxy-import --tests --locked
      - name: Run MySQL server contracts
        run: cargo test -p tjxy-server --tests --locked
